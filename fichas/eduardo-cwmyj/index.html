<!doctype html>
<html lang="pt-BR">
<head>

<style>
:root{color-scheme:light dark;--bg:#f2f4f6;--card:#fff;--ink:#12202b;--mute:#5d6d78;--line:#dbe2e7;--chip:#e5eaee;--accent:#2456c8;--accent-ink:#fff;--soft:#edf2ff;--danger:#a52a20}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151b;--card:#17212a;--ink:#eaf0f4;--mute:#a1afb8;--line:#2d3b46;--chip:#222e38;--accent:#6f98ff;--accent-ink:#071027;--soft:#1b2b55;--danger:#ff9b91}}
:root[data-theme="dark"]{--bg:#0e151b;--card:#17212a;--ink:#eaf0f4;--mute:#a1afb8;--line:#2d3b46;--chip:#222e38;--accent:#6f98ff;--accent-ink:#071027;--soft:#1b2b55;--danger:#ff9b91}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:680px;margin:auto;padding:16px 16px 44px}
.header{background:var(--hdr,#14264a);transition:background .3s;color:#fff;border-radius:24px;padding:22px;margin-top:6px}.eyebrow{font-size:13px;color:#c4d2ec;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.header h1{font-size:clamp(32px,8vw,46px);line-height:1;margin:12px 0 8px;letter-spacing:-.03em}.header p{margin:0;color:#dbe4f4}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.meta span{background:#ffffff1f;border-radius:999px;padding:6px 11px;font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.toolbar button,.action{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0 13px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer}.toolbar .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}.day-tab{flex:0 0 auto;min-width:76px;min-height:58px;border:0;border-radius:14px;background:var(--chip);color:var(--ink);font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;padding:6px 10px}.day-tab small{display:block;font-size:11px;font-weight:500;color:var(--mute);margin-top:2px}.day-tab.active{background:var(--day-color,var(--accent));color:#fff}.day-tab.active small{color:#fff}.day-tab.rest{opacity:.75}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px}.card h2{font-size:28px;line-height:1.1;margin:0}.muted{color:var(--mute);font-size:14px}.progress{height:7px;background:var(--chip);border-radius:8px;overflow:hidden;margin:15px 0 5px}.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}.group-title{font-size:18px;margin:22px 0 4px;padding-left:10px;border-left:4px solid var(--day-color,var(--accent))}.exercise{display:grid;grid-template-columns:44px 1fr 82px;gap:10px;align-items:center;border-top:1px solid var(--line);padding:13px 0}.group-title+.exercise{border-top:0}.check{width:42px;height:42px;border:2px solid var(--mute);border-radius:12px;background:transparent;color:#fff;font-size:22px;cursor:pointer}.check[aria-pressed="true"]{background:var(--day-color,var(--accent));border-color:var(--day-color,var(--accent))}.check[aria-pressed="true"]:after{content:"✓"}.exercise.done .name{text-decoration:line-through;opacity:.55}.name{font-weight:700}.details{color:var(--mute);font-size:13px;margin-top:2px}.video{display:inline-block;color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;margin-top:6px}.load{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;font:inherit}.reset{border:0;background:transparent;color:var(--mute);text-decoration:underline;padding:11px 0;cursor:pointer;font-family:inherit;font-size:14px}.rest-box{background:var(--soft);border-radius:14px;padding:15px;margin-top:16px}.rest-box strong{display:block;font-size:18px;margin-bottom:4px}.notes p{margin:10px 0}.notes strong{display:block}.footer{margin:22px 0 0;color:var(--mute);font-size:13px;text-align:center}.footer:empty{display:none}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:999px;font-size:14px;transition:transform .2s;z-index:10}.toast.show{transform:translate(-50%,0)}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media(max-width:450px){.wrap{padding:12px 12px 34px}.header{padding:19px}.exercise{grid-template-columns:42px 1fr 70px;gap:8px}.name{font-size:15px}.load{font-size:14px}}
@media print{body{background:#fff;color:#111}.wrap{max-width:none;padding:0}.header{color:#111;background:#fff;border:2px solid #14264a;border-radius:0}.header p,.eyebrow,.meta span,.muted,.details,.footer{color:#333}.meta span{border:1px solid #aaa;background:#fff}.toolbar,.day-tabs,.video,.reset,.toast{display:none!important}.card{border:1px solid #999;break-inside:avoid}.exercise{break-inside:avoid}.load,.print-load{border:1px solid #777}.rest-box{background:#eee;color:#111}.name{text-decoration:none!important;opacity:1!important}.print-day::before{content:"Ficha de treino · ";font-weight:700}body.print-all #dayContent{display:none!important}body.print-all #printAll{display:block!important}#printAll{display:none}.print-all-card{break-inside:avoid;margin-top:12px}.print-check{display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid #777;border-radius:8px;font-size:18px}.print-check.done{background:#ddd}.print-load{display:block;width:100%;height:44px;padding:10px 4px;text-align:center}.print-all-card .exercise{grid-template-columns:34px 1fr 82px}}
.last{font-size:13px;color:var(--mute);margin-top:3px}.last b{color:var(--ink)}
.celebrate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(6,10,20,.74);animation:cfade .25s ease-out}.celebrate.out{opacity:0;transition:opacity .25s}.celebrate canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.celebrate-card{position:relative;z-index:1;width:100%;max-width:340px;text-align:center;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:26px 22px 20px;box-shadow:0 18px 50px #0008;animation:cpop .45s cubic-bezier(.2,1.4,.4,1)}.celebrate-emoji{font-size:44px;line-height:1}.celebrate-card h2{font-size:30px;line-height:1.1;margin:10px 0 6px}.celebrate-card p{margin:0 0 18px;color:var(--mute);font-size:16px}.celebrate-card .action{width:100%;background:var(--day-color,var(--accent));border-color:transparent;color:#fff}
@keyframes cfade{from{opacity:0}to{opacity:1}}@keyframes cpop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.celebrate-card{animation:none}}
@media print{.celebrate,.last{display:none!important}}
.install{display:grid;gap:8px;border-color:var(--accent)}.install strong{font-size:16px}.install .muted{font-size:14px}.install-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.install .action{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:0 18px}.install .reset{padding:11px 6px}
@media print{.install{display:none!important}}
[hidden]{display:none!important}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:0 16px}
.links .video,.rest-btn{margin-top:6px;padding:4px 0}
.rest-btn{border:0;background:none;color:var(--accent);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.exercise.noload{grid-template-columns:44px 1fr}
.rpanel{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -10px 28px #0003;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.rest-in{max-width:680px;margin:auto;display:grid;gap:10px}
.rest-top{display:flex;align-items:center;gap:12px}
.rest-time{font-size:42px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.rest-msg{flex:1;font-size:14px;color:var(--mute)}
.rpanel.fin .rest-time{color:var(--accent)}
.rest-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:0}
.rest-row+.rest-row{margin-top:8px}
.rest-row input{width:110px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;font:inherit}
.action.sm{min-height:40px;padding:0 12px}
body.has-rest .wrap{padding-bottom:310px}
@media print{.rpanel,.rest-btn{display:none!important}.print-all-card .exercise.noload{grid-template-columns:34px 1fr}}
/* ===== Calendário de treinos ===== */
.cal{--g1:#137a3e;--g2:#4f9f6d;--gbg:rgba(19,122,62,.15)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .cal{--g1:#4ade80;--g2:#86d4a2;--gbg:rgba(74,222,128,.18)}}
:root[data-theme="dark"] .cal{--g1:#4ade80;--g2:#86d4a2;--gbg:rgba(74,222,128,.18)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h2{font-size:19px;margin:0}
.cal-nav{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.cal-nav:disabled{opacity:.35;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;text-align:center}
.cal-w{font-size:12px;color:var(--mute);padding:2px 0}
.cal-d{height:44px;border:2px solid transparent;border-radius:50%;background:transparent;color:var(--ink);font:inherit;font-size:15px;padding:0;cursor:pointer}
.cal-d.full,.cal-mini.full{color:var(--g1);font-weight:800;background:var(--gbg)}
.cal-d.part,.cal-mini.part{color:var(--g2);font-weight:700;border-style:dashed;border-color:var(--g2)}
.cal-d.today{box-shadow:0 0 0 2px var(--accent)}
.cal-d.sel{outline:2px solid var(--ink);outline-offset:2px}
.cal-leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:14px 0 8px;font-size:13px;color:var(--mute)}
.cal-leg span{display:inline-flex;align-items:center;gap:6px}
.cal-mini{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:12px;border:2px solid transparent}
.cal{position:relative}
.cal .cal-head{margin-top:18px}
.cal-x{position:absolute;top:4px;right:4px;width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--mute);font-size:16px;line-height:1;cursor:pointer}
.cal-x:hover,.cal-x:focus-visible{background:var(--chip);color:var(--ink)}
@media print{.cal,#calBtn{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="eyebrow" id="trainer"></div>
    <h1 id="student"></h1>
    <p id="subtitle"></p>
    <div class="meta" id="meta"></div>
  </header>
 
  <div class="toolbar" aria-label="Ações da ficha">
    <button class="primary" id="printBtn" type="button">Salvar / imprimir PDF (ficha completa)</button>
    <button id="restOpen" type="button">⏱ Timer de descanso</button>
    <button id="calBtn" type="button" aria-expanded="false" aria-controls="cal">📅 Calendário</button>
    <button id="resetAllBtn" type="button">Zerar marcações de hoje</button>
    <button id="themeBtn" type="button">Alternar tema</button>
  </div>
 
    <section class="card cal" id="cal" hidden aria-label="Calendário de treinos">
    <button class="cal-x" id="calX" type="button" aria-label="Fechar calendário">✕</button>
    <div class="cal-head">
      <button class="cal-nav" id="calPrev" type="button" aria-label="Mês anterior">‹</button>
      <h2 id="calTitle"></h2>
      <button class="cal-nav" id="calNext" type="button" aria-label="Próximo mês">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-leg"><span><b class="cal-mini full" aria-hidden="true">12</b>Treino completo</span><span><b class="cal-mini part" aria-hidden="true">12</b>Treino parcial</span></div>
    <div class="muted" id="calInfo" role="status" aria-live="polite"></div>
  </section>

  <nav class="day-tabs" id="dayTabs" aria-label="Dias de treino"></nav>
  <main id="dayContent"></main>
  <div id="printAll" aria-hidden="true"></div>
 
  <section class="card notes" id="notesCard">
    <h2>Orientações gerais</h2>
    <div id="notes"></div>
  </section>
  <div style="text-align:center"><button class="reset" id="wipeBtn" type="button">Apagar histórico de cargas deste aparelho</button></div>
  <p class="footer" id="footer"></p>
</div>
<div class="rpanel" id="rest" hidden role="region" aria-label="Timer de descanso"><div class="rest-in">
  <div class="rest-top"><div class="rest-time" id="restTime">00:00</div><div class="rest-msg" id="restMsg" role="status" aria-live="polite"></div><button class="action sm" id="restClose" type="button" aria-label="Fechar timer">✕</button></div>
  <div class="rest-row" id="restCtrl" hidden><button class="action sm" id="restToggle" type="button">Pausar</button><button class="action sm" id="restMinus" type="button">−15 s</button><button class="action sm" id="restPlus" type="button">+15 s</button></div>
  <div id="restSet">
    <div class="rest-row"><button class="action sm" data-rest="30" type="button">30 s</button><button class="action sm" data-rest="45" type="button">45 s</button><button class="action sm" data-rest="60" type="button">60 s</button><button class="action sm" data-rest="90" type="button">90 s</button><button class="action sm" data-rest="120" type="button">2 min</button><button class="action sm" data-rest="180" type="button">3 min</button></div>
    <div class="rest-row"><input id="restSecs" type="number" inputmode="numeric" min="5" max="900" placeholder="segundos" aria-label="Tempo de descanso em segundos"><button class="action sm" id="restGo" type="button">Iniciar</button><button class="action sm" id="soundBtn" type="button" aria-pressed="true">🔔 Som ligado</button></div>
  </div>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
 
<script>

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Cada exercício tem um id estável (nome sem acentos). Se você RENOMEAR um exercício mas quiser manter o histórico

const slug=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const IDS={};
PLAN.dias.forEach(d=>{const seen={};(d.grupos||[]).forEach((g,gi)=>(g.ex||[]).forEach((e,ei)=>{let id=e[5]||slug(e[0]);seen[id]=(seen[id]||0)+1;if(seen[id]>1)id+='-'+seen[id];IDS[d.id+':'+gi+':'+ei]=id}))});
const xid=(d,gi,ei)=>IDS[d.id+':'+gi+':'+ei];
const isOpt=e=>/\(opcional\)/i.test(e[0]);   /* exercício opcional: não conta como obrigatório */
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const storageKey='ficha-treino-v1:'+PLAN.codigo;
const todayKey=today();
let state={day:PLAN.dias[0]?.id||'',marks:{},loads:{}};
try{state=Object.assign(state,JSON.parse(localStorage.getItem(storageKey)||'{}'))}catch(e){}
state.marks=state.marks||{};state.loads=state.loads||{};state.hist=state.hist||{};state.cele=state.cele||{};
if(!(state.v>=2)){
  const cv=k=>{const p=k.split(':');if(p.length!==4)return null;const id=IDS[p[1]+':'+p[2]+':'+p[3]];return id?p[0]+':'+p[1]+':'+id:null};
  ['marks','loads'].forEach(n=>{const o={};Object.keys(state[n]).forEach(k=>{const nk=cv(k);if(nk)o[nk]=state[n][k]});state[n]=o});
  state.hist={};state.v=2;
}
Object.keys(state.loads).forEach(k=>{const p=k.split(':'),v=String(state.loads[k]||'').trim();if(p.length===3&&v){const ek=p.slice(1).join(':');(state.hist[ek]=state.hist[ek]||{})[p[0]]=v}});
let current=PLAN.dias.find(d=>d.id===['dom','seg','ter','qua','qui','sex','sab'][new Date().getDay()])?.id||PLAN.dias[0]?.id;
 
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2400)}
function markKey(d,gi,ei){return `${todayKey}:${d.id}:${xid(d,gi,ei)}`}
function chips(){
  $('#dayTabs').innerHTML=PLAN.dias.map(d=>`<button class="day-tab ${d.id===current?'active':''} ${d.descanso?'rest':''}" style="--day-color:${esc(d.cor)}" data-day="${esc(d.id)}" type="button">${esc(d.nome.slice(0,3))}<small>${esc(d.id===['dom','seg','ter','qua','qui','sex','sab'][new Date().getDay()]?'hoje':d.descanso?'folga':d.curto||'treino')}</small></button>`).join('');
}
/* Tipo do exercício: 'carga' (padrão, tem campo kg), 'tempo' (prancha etc.), 'cardio' (esteira etc.) ou 'corpo' (peso do corpo).
   Pode ser definido no 7º item do exercício; se não for, é deduzido: "bloco" = cardio; minutos/segundos = tempo. */
function kindOf(e){const k=String(e[6]||'').toLowerCase();if(k)return k;if(/bloco/i.test(e[1]))return'cardio';if(/\d\s*(min|seg|s)\b/i.test(e[2]))return'tempo';return'carga'}
function restSecs(r){const t=String(r||''),m=t.match(/\d+(?:[.,]\d+)?/);if(!m)return 0;const n=parseFloat(m[0].replace(',','.'));return Math.round(/min/i.test(t)?n*60:n)}
function fmtSec(s){return s<120?s+' s':Math.floor(s/60)+' min'+(s%60?' '+s%60+' s':'')}
function restBtn(e){const s=restSecs(e[3]);return s>=5?`<button class="rest-btn" type="button" data-rest="${s}">⏱ Descanso ${fmtSec(s)}</button>`:''}
function detail(e){
  const raw=String(e[3]||'').trim(),has=raw&&!/^[—–-]+$/.test(raw),des=has?' · descanso '+esc(raw):'';
  if(kindOf(e)==='cardio')return esc(e[2])+des;
  const s=String(e[1]).split('+'),r=String(e[2]).split('•');
  if(s.length>1&&s.length===r.length)return s.map((x,i)=>esc(x.trim())+' · '+esc(r[i].replace(/^[^:]*:\s*/,'').trim())+' reps').join('<br>')+(has?'<br>descanso '+esc(raw):'');
  const reps=/^[\d\s–\-.,]+$/.test(String(e[2]))?esc(e[2])+' repetições':esc(e[2]);
  return esc(e[1])+' × '+reps+des;
}
function renderDay(){
  const d=PLAN.dias.find(x=>x.id===current);if(!d)return;

  (d.grupos||[]).forEach((g,gi)=>{if(g.nome)html+=`<h3 class="group-title">${esc(g.nome)}</h3>`;(g.ex||[]).forEach((e,ei)=>{const k=markKey(d,gi,ei),isDone=!!state.marks[k],nl=kindOf(e)!=='carga';if(!isOpt(e)){total++;if(isDone)done++}const url=shortVideo(e[4]||('https://www.youtube.com/results?search_query='+encodeURIComponent(e[0]+' execução')));html+=`<div class="exercise ${isDone?'done':''}${nl?' noload':''}"><button class="check" type="button" data-check="${esc(k)}" aria-pressed="${isDone}" aria-label="Marcar ${esc(e[0])} como concluído"></button><div><div class="name">${esc(e[0])}</div><div class="details">${detail(e)}</div>${nl?'':lastLoadHtml(d,gi,ei)}<div class="links"><a class="video" href="${esc(url)}" target="_blank" rel="noopener">Ver demonstração</a>${restBtn(e)}</div></div>${nl?'':`<input class="load" type="text" inputmode="decimal" placeholder="kg" value="${esc(state.loads[k]||'')}" data-load="${esc(k)}" aria-label="Carga usada em ${esc(e[0])}">`}</div>`})});
  $('#dayContent').innerHTML=`<section class="card print-day" style="--day-color:${esc(d.cor)}"><div class="muted">${esc(d.nome)}</div><h2>${esc(d.titulo)}</h2><div class="muted">${esc(d.foco||'')}</div><div class="progress"><i style="width:${total?done/total*100:0}%"></i></div><div class="muted">${done} de ${total} exercícios concluídos hoje</div>${html}<button class="reset" type="button" data-reset="${esc(d.id)}">Zerar marcações deste dia</button></section>`;
}
function renderPrintAll(){
  let out='';
  PLAN.dias.forEach(d=>{
    if(d.descanso){out+=`<section class="card print-all-card" style="--day-color:${esc(d.cor)}"><div class="muted">${esc(d.nome)}</div><h2>${esc(d.titulo)}</h2><div class="rest-box"><strong>Dia de descanso</strong><span>${esc(d.foco||'Priorize sua recuperação.')}</span></div></section>`;return}
    let body='';
    (d.grupos||[]).forEach((g,gi)=>{if(g.nome)body+=`<h3 class="group-title">${esc(g.nome)}</h3>`;(g.ex||[]).forEach((e,ei)=>{const k=markKey(d,gi,ei),done=!!state.marks[k],nl=kindOf(e)!=='carga';body+=`<div class="exercise ${done?'done':''}${nl?' noload':''}"><span class="print-check ${done?'done':''}">${done?'✓':''}</span><div><div class="name">${esc(e[0])}</div><div class="details">${detail(e)}</div></div>${nl?'':`<span class="print-load">${esc(state.loads[k]||'')}</span>`}</div>`})});
    out+=`<section class="card print-all-card" style="--day-color:${esc(d.cor)}"><div class="muted">${esc(d.nome)}</div><h2>${esc(d.titulo)}</h2><div class="muted">${esc(d.foco||'')}</div>${body}</section>`;
  });
  $('#printAll').innerHTML=out;
}
function lastLoad(ek){const h=state.hist[ek]||{};const ds=Object.keys(h).filter(x=>x<todayKey).sort();return ds.length?{d:ds[ds.length-1],v:h[ds[ds.length-1]]}:null}
function lastLoadHtml(d,gi,ei){const l=lastLoad(`${d.id}:${xid(d,gi,ei)}`);if(!l)return'';const v=/[a-z]/i.test(l.v)?l.v:l.v+' kg',dt=l.d.slice(8,10)+'/'+l.d.slice(5,7);return `<div class="last">Última carga: <b>${esc(v)}</b> · ${dt}</div>`}
function checkCelebrate(){
  const d=PLAN.dias.find(x=>x.id===current);if(!d||d.descanso)return;
  let total=0,done=0;(d.grupos||[]).forEach((g,gi)=>(g.ex||[]).forEach((e,ei)=>{if(isOpt(e))return;total++;if(state.marks[markKey(d,gi,ei)])done++}));
  const ck=todayKey+':'+d.id;
  if(total&&done===total&&!state.cele[ck]){state.cele[ck]=1;save();celebrate(d.cor)}
}
function celebrate(cor){
  const old=$('#celebrate');if(old)old.remove();
  const box=document.createElement('div');box.id='celebrate';box.className='celebrate';box.setAttribute('role','status');box.style.setProperty('--day-color',cor||'#2456c8');
  box.innerHTML='<canvas aria-hidden="true"></canvas><div class="celebrate-card"><div class="celebrate-emoji">🎉</div><h2>Parabéns!</h2><p>Você concluiu mais um dia de treino!</p><button class="action" type="button">Continuar</button></div>';
  document.body.appendChild(box);
  const cv=box.querySelector('canvas'),reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let ctx=null;try{ctx=!reduce&&cv.getContext?cv.getContext('2d'):null}catch(e){}
  let raf=0,over=false,fit=null;
  const auto=setTimeout(close,9000);
  function onKey(e){if(e.key==='Escape')close()}
  function close(){if(over)return;over=true;cancelAnimationFrame(raf);clearTimeout(auto);document.removeEventListener('keydown',onKey);if(fit)window.removeEventListener('resize',fit);box.classList.add('out');setTimeout(()=>box.remove(),260)}
  box.addEventListener('click',close);document.addEventListener('keydown',onKey);
  try{box.querySelector('button').focus({preventScroll:true})}catch(e){}
  if(!ctx){cv.remove();return}
  const dpr=Math.min(window.devicePixelRatio||1,2),cores=['#ff5a5f','#ffd166','#06d6a0','#4cc9f0','#b388ff','#ff9f1c','#ffffff'],rockets=[],parts=[];
  let W=0,H=0,launched=0,next=0,t0=0,last=0;
  fit=()=>{W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)};
  fit();window.addEventListener('resize',fit);
  const burst=(x,y)=>{const c1=cores[Math.random()*cores.length|0],c2=cores[Math.random()*cores.length|0],n=64;for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.12,sp=1.4+Math.random()*3.1;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.009+Math.random()*.009,c:i%3?c1:c2})}};
  const frame=now=>{
    if(over)return;if(!t0)t0=last=now;
    const dt=Math.min((now-last)/16.67,2.5);last=now;
    if(launched<9&&now-t0>=next){rockets.push({x:W*(.12+Math.random()*.76),y:H+10,vy:-H*.012*(.9+Math.random()*.25),ty:H*(.14+Math.random()*.3)});launched++;next+=260+Math.random()*320}
    ctx.globalCompositeOperation='destination-out';ctx.globalAlpha=1;ctx.fillStyle='rgba(0,0,0,.26)';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y+=r.vy*dt;ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillRect(r.x-1.5,r.y,3,9);if(r.y<=r.ty){burst(r.x,r.y);rockets.splice(i,1)}}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.045*dt;p.vx*=.992;p.life-=p.decay*dt;if(p.life<=0){parts.splice(i,1);continue}ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,6.2832);ctx.fill()}
    if(launched>=9&&!rockets.length&&!parts.length){ctx.clearRect(0,0,W,H);return}
    raf=requestAnimationFrame(frame);
  };
  raf=requestAnimationFrame(frame);
}
function render(){chips();renderDay();const d=PLAN.dias.find(x=>x.id===current);if(d){$('.header').style.setProperty('--hdr',d.cor);const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d.cor)}}

/* ===== Timer de descanso (com aviso sonoro curto) ===== */
const R={end:0,left:0,last:60,run:false,tid:0,ctx:null,lock:null,sound:true,started:false,fin:false};
try{R.sound=localStorage.getItem('ficha-treino-som')!=='0'}catch(e){}
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function audioUnlock(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;R.ctx=R.ctx||new A();if(R.ctx.state==='suspended')R.ctx.resume()}catch(e){}}
function beep(){
  if(!R.sound)return;
  try{if(R.ctx){const c=R.ctx,t=c.currentTime;for(let i=0;i<4;i++){const o=i*.4,osc=c.createOscillator(),g=c.createGain();osc.type='triangle';osc.frequency.value=i%2?1175:880;g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.8,t+o+.02);g.gain.setValueAtTime(.8,t+o+.2);g.gain.exponentialRampToValueAtTime(.0001,t+o+.3);osc.connect(g);g.connect(c.destination);osc.start(t+o);osc.stop(t+o+.32)}}}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([300,120,300,120,300])}catch(e){}
}
async function wake(on){try{if(on){if('wakeLock' in navigator&&!R.lock){R.lock=await navigator.wakeLock.request('screen');R.lock.addEventListener('release',()=>{R.lock=null})}}else if(R.lock){const l=R.lock;R.lock=null;await l.release()}}catch(e){}}
function restPaint(){
  $('#restTime').textContent=mmss(R.left);
  $('#restToggle').textContent=R.run?'Pausar':(R.left>0?'Retomar':'Reiniciar');
  $('#restCtrl').hidden=!R.started;$('#restSet').hidden=R.run;
  $('#rest').classList.toggle('fin',R.fin);
  $('#soundBtn').textContent=R.sound?'🔔 Som ligado':'🔕 Som desligado';$('#soundBtn').setAttribute('aria-pressed',String(R.sound));

function openRest(){$('#rest').hidden=false;document.body.classList.add('has-rest');restPaint()}
function closeRest(){R.run=false;R.started=false;R.fin=false;R.left=0;clearInterval(R.tid);wake(false);$('#restMsg').textContent='';$('#rest').hidden=true;document.body.classList.remove('has-rest')}
function restTick(){if(!R.run)return;R.left=Math.max(0,Math.ceil((R.end-Date.now())/1000));if(R.left<=0)restDone();else restPaint()}
function restDone(){R.run=false;R.fin=true;clearInterval(R.tid);R.left=0;$('#restMsg').textContent='Descanso terminou! Hora da próxima série.';restPaint();beep();wake(false)}
function restStart(sec){
  sec=Math.round(Number(sec));openRest();
  if(!(sec>=5&&sec<=900)){$('#restMsg').textContent='Digite um tempo de 5 a 900 segundos.';return}
  audioUnlock();R.last=sec;R.left=sec;R.end=Date.now()+sec*1000;R.run=true;R.started=true;R.fin=false;
  clearInterval(R.tid);R.tid=setInterval(restTick,250);$('#restMsg').textContent='Descansando...';restPaint();wake(true);
}
function restToggle(){
  audioUnlock();
  if(R.run){R.left=Math.max(1,Math.ceil((R.end-Date.now())/1000));R.run=false;clearInterval(R.tid);$('#restMsg').textContent='Pausado.';wake(false);restPaint()}
  else if(R.left>0){R.end=Date.now()+R.left*1000;R.run=true;R.fin=false;R.tid=setInterval(restTick,250);$('#restMsg').textContent='Descansando...';wake(true);restPaint()}
  else restStart(R.last);
}
function restAdj(d){if(R.run){R.end+=d*1000;if(R.end-Date.now()<1000)R.end=Date.now()+1000;restTick()}else{R.left=Math.max(0,Math.min(900,R.left+d));R.fin=false;restPaint()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-rest]');if(b)restStart(b.dataset.rest)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&R.run){restTick();wake(true)}});

/* ===== Calendário de treinos (marca os dias em que a pessoa treinou) ===== */
(function(){
  const MIN=3; /* mínimo de exercícios marcados para o dia contar como treinado */
  const pad=n=>String(n).padStart(2,'0');
  const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
  let cur=new Date(new Date().getFullYear(),new Date().getMonth(),1),sel='';
  const OPT=new Set();PLAN.dias.forEach(d=>(d.grupos||[]).forEach((g,gi)=>(g.ex||[]).forEach((e,ei)=>{if(isOpt(e))OPT.add(d.id+':'+xid(d,gi,ei))})));
  function dados(){
    const por={};
    Object.keys(state.marks).forEach(k=>{const p=k.split(':');if(p.length<3||!/^\d{4}-\d\d-\d\d$/.test(p[0])||OPT.has(p[1]+':'+p[2]))return;const o=por[p[0]]=por[p[0]]||{};o[p[1]]=(o[p[1]]||0)+1});
    const out={};
    Object.keys(por).forEach(dt=>{
      let best=null;
      Object.keys(por[dt]).forEach(id=>{
        const d=PLAN.dias.find(x=>x.id===id);if(!d||d.descanso)return;
        const total=(d.grupos||[]).reduce((a,g)=>a+(g.ex||[]).filter(e=>!isOpt(e)).length,0);if(!total)return;
        const done=Math.min(por[dt][id],total),r=done/total;
        if(!best||r>best.r||(r===best.r&&done>best.done))best={r,done,total,titulo:d.titulo};
      });
      if(best&&best.done>=Math.min(MIN,best.total))out[dt]=Object.assign(best,{full:best.done>=best.total});
    });
    return out;
  }
  function resumo(dd,n,c){
    const el=$('#calInfo'),mes=`${cur.getFullYear()}-${pad(cur.getMonth()+1)}`;
    if(sel&&sel.slice(0,7)===mes){
      const [y,m,d]=sel.split('-').map(Number),i=dd[sel];
      const txt=cap(new Date(y,m-1,d).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'}));
      el.textContent=txt+': '+(i?`${i.titulo} — ${i.done} de ${i.total} exercícios`+(i.full?' (completo)':''):`sem treino registrado (mínimo de ${MIN} exercícios marcados).`);
      return;
    }
    el.textContent=n?`${n} ${n===1?'dia treinado':'dias treinados'} neste mês · ${c} ${c===1?'completo':'completos'}`:'Nenhum treino registrado neste mês ainda.';
  }
  function desenhar(){
    const y=cur.getFullYear(),m=cur.getMonth(),dd=dados();
    const primeiro=new Date(y,m,1).getDay(),dias=new Date(y,m+1,0).getDate();
    const nomeMes=new Intl.DateTimeFormat('pt-BR',{month:'long'}).format(cur);
    $('#calTitle').textContent=cap(nomeMes)+' de '+y;
    let h=['D','S','T','Q','Q','S','S'].map(x=>`<span class="cal-w" aria-hidden="true">${x}</span>`).join('');
    for(let i=0;i<primeiro;i++)h+='<span></span>';
    let n=0,c=0;
    for(let d=1;d<=dias;d++){
      const key=`${y}-${pad(m+1)}-${pad(d)}`,i=dd[key];
      if(i){n++;if(i.full)c++}
      const st=i?(i.full?'treino completo':'treino parcial'):'sem treino registrado';
      h+=`<button type="button" class="cal-d${i?(i.full?' full':' part'):''}${key===todayKey?' today':''}${key===sel?' sel':''}" data-cal="${key}" aria-label="${d} de ${nomeMes}: ${st}"${key===todayKey?' aria-current="date"':''}>${d}</button>`;
    }
    $('#calGrid').innerHTML=h;
    const hoje=new Date();
    $('#calNext').disabled=cur>=new Date(hoje.getFullYear(),hoje.getMonth(),1);
    resumo(dd,n,c);
  }
  $('#calBtn').onclick=()=>{
    const p=$('#cal');p.hidden=!p.hidden;$('#calBtn').setAttribute('aria-expanded',String(!p.hidden));
    if(!p.hidden){const t=new Date();cur=new Date(t.getFullYear(),t.getMonth(),1);sel='';desenhar()}
  };
  $('#calX').onclick=()=>{$('#cal').hidden=true;$('#calBtn').setAttribute('aria-expanded','false');$('#calBtn').focus({preventScroll:true})};
  $('#calPrev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);sel='';desenhar()};
  $('#calNext').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);sel='';desenhar()};
  $('#calGrid').addEventListener('click',e=>{
    const b=e.target.closest('[data-cal]');if(!b)return;
    sel=sel===b.dataset.cal?'':b.dataset.cal;desenhar();
    const f=$('#calGrid .sel');if(f)f.focus({preventScroll:true});
  });
  /* atualiza sozinho quando a pessoa marca/desmarca exercícios ou zera o dia */
  document.addEventListener('click',e=>{if(!$('#cal').hidden&&!e.target.closest('#cal,#calBtn'))setTimeout(desenhar,0)});
})();
/* ===== Aplicativo no celular: abre sem internet e pode ser instalado na tela inicial ===== */
(function(){
  if(!/^https?:$/.test(location.protocol))return; /* prévias, arquivo local etc.: não se aplica */
  try{
  const CACHE='fichas-treino-v1';
  const base=new URL('./',location.href).href;
  const standalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  function iconPng(size){
    try{
      const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');if(!x)return'';
      const u=size/100;
      x.fillStyle='#14264a';x.fillRect(0,0,size,size);
      x.translate(size/2,size/2);x.scale(.82,.82);x.translate(-size/2,-size/2);
      const rr=(a,b,w,h,r)=>{x.beginPath();if(x.roundRect)x.roundRect(a*u,b*u,w*u,h*u,r*u);else x.rect(a*u,b*u,w*u,h*u);x.fill()};
      x.fillStyle='#ffffff';rr(27,47,46,6,3);rr(20,34,9,32,3);rr(71,34,9,32,3);
      x.fillStyle='#6f98ff';rr(11,41,8,18,3);rr(81,41,8,18,3);
      return c.toDataURL('image/png');
    }catch(e){return''}
  }
  /* ícone e manifesto gerados aqui mesmo (nada de arquivos extras para subir) */
  try{
    const i192=iconPng(192),i512=iconPng(512),i180=iconPng(180);
    if(i192&&i512){
      const m={id:base,name:'Ficha de treino · '+PLAN.nomePublico,short_name:'Treino',description:'Ficha de treino personalizada',lang:'pt-BR',start_url:base,scope:base,display:'standalone',orientation:'portrait',background_color:'#14264a',theme_color:'#14264a',icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
      const l=document.createElement('link');l.rel='manifest';l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));document.head.appendChild(l);
      const a=document.createElement('link');a.rel='apple-touch-icon';a.href=i180;document.head.appendChild(a);
    }
  }catch(e){}
  /* funcionar sem internet: o arquivo sw.js fica na raiz do repositório */
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      Promise.resolve().then(()=>navigator.serviceWorker.register(new URL('../../sw.js',location.href).href))
        .then(()=>navigator.serviceWorker.ready)
        .then(()=>{const u=new URL(location.href);u.search='';u.hash='';return caches.open(CACHE).then(c=>c.add(u.href))})
        .catch(()=>{});
    });
  }
  /* aviso "Use como aplicativo" (botão no Android, passo a passo no iPhone) */
  const KEY='ficha-treino-instalar';
  let dismissed=false;try{dismissed=localStorage.getItem(KEY)==='1'}catch(e){}
  let deferred=null;
  const ua=navigator.userAgent||'';
  const ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const android=/android/i.test(ua);
  const hide=remember=>{const el=$('#install');if(el)el.remove();if(remember){dismissed=true;try{localStorage.setItem(KEY,'1')}catch(e){}}};
  function show(mode){
    if(standalone()||dismissed||$('#install'))return;
    const txt={
      prompt:'Instale a ficha na tela inicial do celular. Ela abre como um app, até sem internet.',
      ios:'Para instalar: toque em Compartilhar (o quadrado com a seta para cima) e depois em “Adicionar à Tela de Início”. A ficha passa a abrir como um app, até sem internet.',
      android:'Para instalar: toque no menu ⋮ do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”. A ficha passa a abrir como um app, até sem internet.'
    }[mode];
    const el=document.createElement('section');el.className='card install';el.id='install';
    el.innerHTML='<strong>Use como aplicativo</strong><span class="muted">'+txt+'</span><div class="install-actions">'+(mode==='prompt'?'<button class="action" id="installGo" type="button">Instalar</button>':'')+'<button class="reset" id="installNo" type="button">'+(mode==='prompt'?'Agora não':'Entendi')+'</button></div>';
    $('.toolbar').insertAdjacentElement('afterend',el);
    const go=$('#installGo');
    if(go)go.onclick=async()=>{if(!deferred)return;deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;hide(false)};
    $('#installNo').onclick=()=>hide(true);
  }
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;hide(false);show('prompt')});
  window.addEventListener('appinstalled',()=>hide(true));
  if(ios)show('ios');else if(android)setTimeout(()=>{if(!deferred)show('android')},4000);
  }catch(e){}
})();
</script>
