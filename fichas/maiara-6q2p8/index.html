<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14264A">
<meta name="description" content="Ficha de treino personalizada.">
<title>Ficha de treino</title>
<style>
:root{color-scheme:light dark;--bg:#f2f4f6;--card:#fff;--ink:#12202b;--mute:#5d6d78;--line:#dbe2e7;--chip:#e5eaee;--accent:#2456c8;--accent-ink:#fff;--soft:#edf2ff;--danger:#a52a20}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151b;--card:#17212a;--ink:#eaf0f4;--mute:#a1afb8;--line:#2d3b46;--chip:#222e38;--accent:#6f98ff;--accent-ink:#071027;--soft:#1b2b55;--danger:#ff9b91}}
:root[data-theme="dark"]{--bg:#0e151b;--card:#17212a;--ink:#eaf0f4;--mute:#a1afb8;--line:#2d3b46;--chip:#222e38;--accent:#6f98ff;--accent-ink:#071027;--soft:#1b2b55;--danger:#ff9b91}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:680px;margin:auto;padding:16px 16px 44px}
.header{background:#14264a;color:#fff;border-radius:24px;padding:22px;margin-top:6px}.eyebrow{font-size:13px;color:#c4d2ec;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.header h1{font-size:clamp(32px,8vw,46px);line-height:1;margin:12px 0 8px;letter-spacing:-.03em}.header p{margin:0;color:#dbe4f4}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.meta span{background:#ffffff1f;border-radius:999px;padding:6px 11px;font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.toolbar button,.action{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0 13px;font:600 14px inherit;cursor:pointer}.toolbar .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}.day-tab{flex:0 0 auto;min-width:76px;min-height:58px;border:0;border-radius:14px;background:var(--chip);color:var(--ink);font:700 15px inherit;cursor:pointer;padding:6px 10px}.day-tab small{display:block;font-size:11px;font-weight:500;color:var(--mute);margin-top:2px}.day-tab.active{background:var(--day-color,var(--accent));color:#fff}.day-tab.active small{color:#fff}.day-tab.rest{opacity:.75}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px}.card h2{font-size:28px;line-height:1.1;margin:0}.muted{color:var(--mute);font-size:14px}.progress{height:7px;background:var(--chip);border-radius:8px;overflow:hidden;margin:15px 0 5px}.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}.group-title{font-size:20px;margin:22px 0 4px;padding-left:10px;border-left:4px solid var(--day-color,var(--accent))}.exercise{display:grid;grid-template-columns:44px 1fr 82px;gap:10px;align-items:center;border-top:1px solid var(--line);padding:13px 0}.group-title+.exercise{border-top:0}.check{width:42px;height:42px;border:2px solid var(--mute);border-radius:12px;background:transparent;color:#fff;font-size:22px;cursor:pointer}.check[aria-pressed="true"]{background:var(--day-color,var(--accent));border-color:var(--day-color,var(--accent))}.check[aria-pressed="true"]:after{content:"✓"}.exercise.done .name{text-decoration:line-through;opacity:.55}.name{font-weight:700}.details{color:var(--mute);font-size:13px;margin-top:2px}.video{display:inline-block;color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;margin-top:6px}.load{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;font:inherit}.reset{border:0;background:transparent;color:var(--mute);text-decoration:underline;padding:11px 0;cursor:pointer;font:14px inherit}.rest-box{background:var(--soft);border-radius:14px;padding:15px;margin-top:16px}.rest-box strong{display:block;font-size:18px;margin-bottom:4px}.notes p{margin:10px 0}.notes strong{display:block}.footer{margin:22px 0 0;color:var(--mute);font-size:13px;text-align:center}.footer:empty{display:none}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:999px;font-size:14px;transition:transform .2s;z-index:10}.toast.show{transform:translate(-50%,0)}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media(max-width:450px){.wrap{padding:12px 12px 34px}.header{padding:19px}.exercise{grid-template-columns:42px 1fr 70px;gap:8px}.name{font-size:15px}.load{font-size:14px}}
@media print{body{background:#fff;color:#111}.wrap{max-width:none;padding:0}.header{color:#111;background:#fff;border:2px solid #14264a;border-radius:0}.header p,.eyebrow,.meta span,.muted,.details,.footer{color:#333}.meta span{border:1px solid #aaa;background:#fff}.toolbar,.day-tabs,.video,.reset,.toast{display:none!important}.card{border:1px solid #999;break-inside:avoid}.exercise{break-inside:avoid}.load,.print-load{border:1px solid #777}.rest-box{background:#eee;color:#111}.name{text-decoration:none!important;opacity:1!important}.print-day::before{content:"Ficha de treino · ";font-weight:700}body.print-all #dayContent{display:none!important}body.print-all #printAll{display:block!important}#printAll{display:none}.print-all-card{break-inside:avoid;margin-top:12px}.print-check{display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid #777;border-radius:8px;font-size:18px}.print-check.done{background:#ddd}.print-load{display:block;width:100%;height:44px;padding:10px 4px;text-align:center}.print-all-card .exercise{grid-template-columns:34px 1fr 82px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="eyebrow" id="trainer"></div>
    <h1 id="student"></h1>
    <p id="subtitle"></p>
    <div class="meta" id="meta"></div>
  </header>

  <div class="toolbar" aria-label="Ações da ficha">
    <button class="primary" id="printBtn" type="button">Salvar / imprimir PDF (ficha completa)</button>
    <button id="resetAllBtn" type="button">Zerar marcações</button>
    <button id="themeBtn" type="button">Alternar tema</button>
  </div>

  <nav class="day-tabs" id="dayTabs" aria-label="Dias de treino"></nav>
  <main id="dayContent"></main>
  <div id="printAll" aria-hidden="true"></div>

  <section class="card notes" id="notesCard">
    <h2>Orientações gerais</h2>
    <div id="notes"></div>
  </section>
  <p class="footer" id="footer"></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =============================================================
   MODELO: edite somente o objeto PLAN abaixo para cada aluno.
   1) Troque codigo por um código único e difícil de adivinhar.
   2) Use apenas o primeiro nome + inicial do sobrenome em nomePublico.
   3) Duplique este arquivo para cada aluno e publique em uma pasta própria.
   ============================================================= */
const PLAN={
  codigo:"maiara-6q2p8",
  nomePublico:"MAIARA A. T.",
  treinador:"ENDREW.P",
  subtitulo:"Plano de treino personalizado",
  objetivo:"Força, hipertrofia e perda de peso",
  frequencia:"4 sessões por semana",
  ciclo:"Ciclo de treino",
  inicio:"29/09/2026",
  revisao:"A definir",
  contato:"",
  dias:[
    {id:"seg",nome:"Segunda",curto:"Costas",cor:"#2456C8",titulo:"Costas e bíceps",foco:"Largura, espessura e desenvolvimento completo da musculatura das costas e bíceps",grupos:[
      {nome:"Costas",ex:[
        ["Puxada alta na polia","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=puxada+alta+na+polia+execucao"],
        ["Remada baixa na polia","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=remada+baixa+na+polia+execucao"],
        ["Remada curvada","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=remada+curvada+execucao"]
      ]},
      {nome:"Bíceps",ex:[
        ["Rosca inclinada com halteres no banco","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=rosca+inclinada+halteres+execucao"],
        ["Rosca alternada com halteres","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=rosca+alternada+halteres+execucao"]
      ]}
    ]},
    {id:"ter",nome:"Terça",descanso:true,cor:"#66737d",titulo:"Descanso",foco:"Recuperação"},
    {id:"qua",nome:"Quarta",curto:"Quadríceps",cor:"#137A3E",titulo:"Quadríceps e glúteos",foco:"Desenvolvimento de quadríceps e glúteos, com fortalecimento geral dos membros inferiores",grupos:[
      {nome:"Quadríceps e glúteos",ex:[
        ["Agachamento SQUAT","1 preparatória + 2 válidas","Preparatória: até 15 • Válidas: 7–10","60–120 s","https://www.youtube.com/results?search_query=agachamento+squat+maquina+execucao"],
        ["Leg press 45°","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=leg+press+45+execucao"],
        ["Cadeira extensora","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=cadeira+extensora+execucao"],
        ["Elevação pélvica","1 preparatória + 2 válidas","Preparatória: até 15 • Válidas: 7–10","60–120 s","https://www.youtube.com/results?search_query=elevacao+pelvica+execucao"],
        ["Cadeira abdutora","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=cadeira+abdutora+execucao"],
        ["Agachamento sumô","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=agachamento+sumo+execucao"]
      ]}
    ]},
    {id:"qui",nome:"Quinta",descanso:true,cor:"#66737d",titulo:"Descanso",foco:"Recuperação"},
    {id:"sex",nome:"Sexta",curto:"Peito",cor:"#C2410C",titulo:"Peito e tríceps",foco:"Desenvolvimento da musculatura do peitoral e tríceps",grupos:[
      {nome:"Peito",ex:[
        ["Supino reto na máquina","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=supino+reto+na+maquina+execucao"],
        ["Supino inclinado na máquina ou com halteres","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=supino+inclinado+maquina+halteres+execucao"],
        ["Crucifixo na máquina","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=crucifixo+na+maquina+execucao"]
      ]},
      {nome:"Tríceps",ex:[
        ["Tríceps na polia com corda","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=triceps+polia+corda+execucao"],
        ["Tríceps na máquina","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=triceps+maquina+execucao"]
      ]}
    ]},
    {id:"sab",nome:"Sábado",descanso:true,cor:"#66737d",titulo:"Descanso",foco:"Recuperação"},
    {id:"dom",nome:"Domingo",curto:"Posteriores",cor:"#7A3FC9",titulo:"Posteriores, glúteos, adutores e panturrilhas",foco:"Desenvolvimento dos músculos posteriores da coxa e glúteos, com trabalho complementar de adutores e panturrilhas",grupos:[
      {nome:"Posteriores e glúteos",ex:[
        ["Cadeira flexora","1 preparatória + 2 válidas","Preparatória: até 15 • Válidas: 7–10","60–120 s","https://www.youtube.com/results?search_query=cadeira+flexora+execucao"],
        ["Stiff","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=stiff+execucao"],
        ["Elevação pélvica","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=elevacao+pelvica+execucao"]
      ]},
      {nome:"Adutores, abdutores e panturrilhas",ex:[
        ["Cadeira adutora","1 preparatória + 2 válidas","Preparatória: até 15 • Válidas: 7–10","60–120 s","https://www.youtube.com/results?search_query=cadeira+adutora+execucao"],
        ["Cadeira abdutora","3 válidas","7–10","60–120 s","https://www.youtube.com/results?search_query=cadeira+abdutora+execucao"],
        ["Panturrilha em pé na máquina","1 preparatória + 2 válidas","Preparatória: até 15 • Válidas: 7–10","60–120 s","https://www.youtube.com/results?search_query=panturrilha+em+pe+maquina+execucao"]
      ]}
    ]}
  ],
  orientacoes:[
    ["Séries preparatórias","Quando indicado, faça 1 série com carga nula ou leve, até 15 repetições, sem gerar fadiga significativa. Depois, realize as 2 séries válidas."],
    ["Séries válidas","Realize as séries na faixa de 7–10 repetições, com foco na execução correta, controle do movimento e progressão gradual da carga."],
    ["Orientação inicial de carga","Nas primeiras semanas, priorize cargas leves a moderadas, com foco no aprendizado dos movimentos, controle da execução e adaptação progressiva."],
    ["Técnica e progressão","A carga deve permitir boa técnica durante toda a série. Não aumente a carga apenas para atingir determinado peso."],
    ["Opção de cardio","Caso sobre tempo ou você esteja sem vontade de realizar algum exercício específico, tente substituí-lo por uma atividade cardiovascular, como esteira ou bicicleta."]
  ]
};
/* ===================== FIM DA ÁREA DE EDIÇÃO ===================== */

const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.toISOString().slice(0,10)};
const storageKey='ficha-treino-v1:'+PLAN.codigo;
const todayKey=today();
let state={day:PLAN.dias[0]?.id||'',marks:{},loads:{}};
try{state=Object.assign(state,JSON.parse(localStorage.getItem(storageKey)||'{}'))}catch(e){}
state.marks=state.marks||{};state.loads=state.loads||{};
let current=PLAN.dias.find(d=>d.id===['dom','seg','ter','qua','qui','sex','sab'][new Date().getDay()])?.id||PLAN.dias[0]?.id;

function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2400)}
function markKey(day,group,index){return `${todayKey}:${day}:${group}:${index}`}
function chips(){
  $('#dayTabs').innerHTML=PLAN.dias.map(d=>`<button class="day-tab ${d.id===current?'active':''} ${d.descanso?'rest':''}" style="--day-color:${esc(d.cor)}" data-day="${esc(d.id)}" type="button">${esc(d.nome.slice(0,3))}<small>${esc(d.id===['dom','seg','ter','qua','qui','sex','sab'][new Date().getDay()]?'hoje':d.descanso?'folga':d.curto||'treino')}</small></button>`).join('');
}
function renderDay(){
  const d=PLAN.dias.find(x=>x.id===current);if(!d)return;
  $('#dayContent').style.setProperty('--day-color',d.cor);
  if(d.descanso){$('#dayContent').innerHTML=`<section class="card print-day"><div class="muted">${esc(d.nome)}</div><h2>${esc(d.titulo)}</h2><div class="rest-box"><strong>Dia de descanso</strong><span>${esc(d.foco||'Priorize sua recuperação.')}</span></div></section>`;return}
  let total=0,done=0,html='';
  (d.grupos||[]).forEach((g,gi)=>{if(g.nome)html+=`<h3 class="group-title">${esc(g.nome)}</h3>`;(g.ex||[]).forEach((e,ei)=>{const k=markKey(d.id,gi,ei),isDone=!!state.marks[k];total++;if(isDone)done++;const url=e[4]||('https://www.youtube.com/results?search_query='+encodeURIComponent(e[0]+' execução'));html+=`<div class="exercise ${isDone?'done':''}"><button class="check" type="button" data-check="${esc(k)}" aria-pressed="${isDone}" aria-label="Marcar ${esc(e[0])} como concluído"></button><div><div class="name">${esc(e[0])}</div><div class="details">${esc(e[1])} × ${esc(e[2])} repetições · descanso ${esc(e[3])}</div><a class="video" href="${esc(url)}" target="_blank" rel="noopener">Ver demonstração</a></div><input class="load" type="text" inputmode="decimal" placeholder="kg" value="${esc(state.loads[k]||'')}" data-load="${esc(k)}" aria-label="Carga usada em ${esc(e[0])}"></div>`})});
  $('#dayContent').innerHTML=`<section class="card print-day" style="--day-color:${esc(d.cor)}"><div class="muted">${esc(d.nome)}</div><h2>${esc(d.titulo)}</h2><div class="muted">${esc(d.foco||'')}</div><div class="progress"><i style="width:${total?done/total*100:0}%"></i></div><div class="muted">${done} de ${total} exercícios concluídos hoje</div>${html}<button class="reset" type="button" data-reset="${esc(d.id)}">Zerar marcações deste dia</button></section>`;
}
function renderPrintAll(){
  let out='';
  PLAN.dias.forEach(d=>{
    if(d.descanso){out+=`<section class="card print-all-card" style="--day-color:${esc(d.cor)}"><div class="muted">${esc(d.nome)}</div><h2>${esc(d.titulo)}</h2><div class="rest-box"><strong>Dia de descanso</strong><span>${esc(d.foco||'Priorize sua recuperação.')}</span></div></section>`;return}
    let body='';
    (d.grupos||[]).forEach((g,gi)=>{if(g.nome)body+=`<h3 class="group-title">${esc(g.nome)}</h3>`;(g.ex||[]).forEach((e,ei)=>{const k=markKey(d.id,gi,ei),done=!!state.marks[k];body+=`<div class="exercise ${done?'done':''}"><span class="print-check ${done?'done':''}">${done?'✓':''}</span><div><div class="name">${esc(e[0])}</div><div class="details">${esc(e[1])} × ${esc(e[2])} repetições · descanso ${esc(e[3])}</div></div><span class="print-load">${esc(state.loads[k]||'')}</span></div>`})});
    out+=`<section class="card print-all-card" style="--day-color:${esc(d.cor)}"><div class="muted">${esc(d.nome)}</div><h2>${esc(d.titulo)}</h2><div class="muted">${esc(d.foco||'')}</div>${body}</section>`;
  });
  $('#printAll').innerHTML=out;
}
function render(){chips();renderDay()}
function init(){
  document.title=`Ficha de treino · ${PLAN.nomePublico}`;$('#trainer').textContent=PLAN.treinador;$('#student').textContent=PLAN.nomePublico;$('#subtitle').textContent=PLAN.subtitulo;
  $('#meta').innerHTML=[PLAN.objetivo,PLAN.frequencia,PLAN.ciclo,`Início: ${PLAN.inicio}`,`Revisão: ${PLAN.revisao}`].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('');
  $('#notes').innerHTML=(PLAN.orientacoes||[]).map(x=>`<p><strong>${esc(x[0])}</strong><span class="muted">${esc(x[1])}</span></p>`).join('');$('#footer').textContent=PLAN.contato||'';render();
}
document.addEventListener('click',e=>{const day=e.target.closest('[data-day]');if(day){current=day.dataset.day;render();window.scrollTo({top:0,behavior:'smooth'});return}const check=e.target.closest('[data-check]');if(check){const k=check.dataset.check;state.marks[k]?delete state.marks[k]:state.marks[k]=1;save();renderDay();return}const reset=e.target.closest('[data-reset]');if(reset){Object.keys(state.marks).filter(k=>k.includes(`:${reset.dataset.reset}:`)).forEach(k=>delete state.marks[k]);save();renderDay();toast('Marcações do dia zeradas');return}});
document.addEventListener('input',e=>{const input=e.target.closest('[data-load]');if(input){state.loads[input.dataset.load]=input.value;save()}});
$('#printBtn').onclick=()=>{renderPrintAll();document.body.classList.add('print-all');window.print()};
window.addEventListener('afterprint',()=>{document.body.classList.remove('print-all');$('#printAll').innerHTML=''});
$('#resetAllBtn').onclick=()=>{if(confirm('Zerar todas as marcações e cargas salvas neste aparelho?')){state={day:current,marks:{},loads:{}};save();renderDay();toast('Dados locais zerados')}};
$('#themeBtn').onclick=()=>{const root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';};
init();
</script>
</body>
</html>
